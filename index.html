const TAU = Math.PI*2;
// All coordinates are in the drawing's local coordinate system. Outline and
// scoring share the same closed contours, including the cut-outs.
const pt=(x,y)=>({x,y});
function rotate(p,a){return pt(p.x*Math.cos(a)-p.y*Math.sin(a),p.x*Math.sin(a)+p.y*Math.cos(a))}
function radial(count,radius,phase=-Math.PI/2){
 return Array.from({length:count},(_,i)=>{const a=phase+TAU*i/count,r=typeof radius==='function'?radius(i,a):radius;return pt(r*Math.cos(a),r*Math.sin(a))})
}
function ellipse(rx,ry,cy=0){return radial(96,1).map(p=>pt(p.x*rx,p.y*ry+cy))}
function star(n,r){return radial(2*n,i=>i%2?r:100)}
// The compact outlines run from the top centre down the right edge.
// Q adds a quadratic curve. Reflecting the half-outline gives identical sides.
function outline(spec){
 const tokens=spec.trim().split(/[ ,]+/);let j=0;
 const read=()=>pt(Number(tokens[j++]),Number(tokens[j++]));
 const half=[read()];
 while(j<tokens.length){
  if(tokens[j]!=='Q'){half.push(read());continue}
  j++;const a=half[half.length-1],b=read(),c=read();
  const steps=Math.max(3,Math.ceil((Math.hypot(a.x-b.x,a.y-b.y)+Math.hypot(b.x-c.x,b.y-c.y))/9));
  for(let k=1;k<=steps;k++){const t=k/steps,s=1-t;half.push(pt(s*s*a.x+2*s*t*b.x+t*t*c.x,s*s*a.y+2*s*t*b.y+t*t*c.y))}
 }
 const poly=half.concat(half.slice(1,-1).reverse().map(p=>pt(-p.x,p.y)));
 return poly.filter((p,i)=>{const a=poly[(i+poly.length-1)%poly.length],b=poly[(i+1)%poly.length];return Math.abs((p.x-a.x)*(b.y-p.y)-(p.y-a.y)*(b.x-p.x))>1e-8});
}

const questions=chapters.flatMap((chapter,group)=>chapter.items.map(item=>({...item,group})));
function makeFigure(q){
 const angle=q.deg*Math.PI/180;
 if(q.radius)return {radius:q.radius,angle};
 const contours=q.contours.map(ring=>ring.map(p=>rotate(p,angle)));
 return {contours,vertices:contours.flat(),angle,total:area(contours[0])-contours.slice(1).reduce((sum,p)=>sum+area(p),0)};
}
const best=Array(questions.length).fill(null);
const ctx=$('game').getContext('2d');
let round=0,figure,phase='ready',pointer=null,A=null,B=null,showAnswer=false,answerStarted=0,score=0,start=0,raf=0;
let width=0,height=0,scale=1,camera={x:0,y:0,k:1},target={x:0,y:0,k:1};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
function axis(a,b){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);return {a,x:-dy/len,y:dx/len}}
function distance(p,l){return (p.x-l.a.x)*l.x+(p.y-l.a.y)*l.y}
function mirror(p,l){const d=2*distance(p,l);return pt(p.x-d*l.x,p.y-d*l.y)}
function area(poly){let sum=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];sum+=a.x*b.y-a.y*b.x}return Math.abs(sum)/2}
// Partition the overlap into vertical strips. Between successive vertices and
// boundary crossings, each occupied interval has linear upper and lower edges.
// Its midpoint height times the strip width is therefore its exact area.
function edges(rings){
 const list=[];
 for(const ring of rings)for(let i=0;i<ring.length;i++){
  const a=ring[i],b=ring[(i+1)%ring.length];
  if(Math.abs(b.x-a.x)<1e-10)continue;
  list.push({a,b,min:Math.min(a.x,b.x),max:Math.max(a.x,b.x),slope:(b.y-a.y)/(b.x-a.x)});
 }
 return list;
}
function ordinate(e,x){return e.a.y+(x-e.a.x)*e.slope}
function crossingsAt(edges,x){
 const ys=[];for(const e of edges)if(e.min<x&&x<e.max)ys.push(ordinate(e,x));
 return ys.sort((a,b)=>a-b);
}
function polygonOverlap(f,l){
 const reflected=f.contours.map(ring=>ring.map(p=>mirror(p,l)));
 const original=edges(f.contours),copy=edges(reflected);
 const cuts=f.vertices.map(p=>p.x).concat(reflected.flat().map(p=>p.x));
 for(const a of original)for(const b of copy){
  const lo=Math.max(a.min,b.min),hi=Math.min(a.max,b.max);
  if(hi<=lo)continue;
  const left=ordinate(a,lo)-ordinate(b,lo),right=ordinate(a,hi)-ordinate(b,hi);
  if(left*right<0)cuts.push(lo+(hi-lo)*left/(left-right));
 }
 cuts.sort((a,b)=>a-b);
 let common=0;
 for(let i=1;i<cuts.length;i++){
  const w=cuts[i]-cuts[i-1];if(w<1e-10)continue;
  const x=cuts[i-1]+w/2,a=crossingsAt(original,x),b=crossingsAt(copy,x);
  let j=0,k=0;
  while(j+1<a.length&&k+1<b.length){
   common+=w*Math.max(0,Math.min(a[j+1],b[k+1])-Math.max(a[j],b[k]));
   if(a[j+1]<b[k+1])j+=2;else k+=2;
  }
 }
 return common;
}
function overlap(f,l){
 let common,total;
 if(f.radius){
  const r=f.radius,d=2*Math.abs(distance(pt(0,0),l));total=Math.PI*r*r;
  common=d>=2*r?0:2*r*r*Math.acos(d/(2*r))-d*.5*Math.sqrt(Math.max(0,4*r*r-d*d));
 }else{
  total=f.total;common=polygonOverlap(f,l);
 }
 const raw=Math.max(0,Math.min(100,100*common/(2*total-common)));
 return raw>100-1e-9?100:raw;
}
function displayValue(n){return n===100?'100.0':Math.min(99.9,n).toFixed(1)}
function passes(value){return value!==null && Number(displayValue(value))>=95}
function path(c,f){
 c.beginPath();
 if(f.radius)c.arc(0,0,f.radius,0,TAU);
 else for(const ring of f.contours){ring.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath()}
}
function randomGenerator(seed){return ()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}}
function landscape(){
 const c=$('art').getContext('2d'),rnd=randomGenerator(1148);c.clearRect(0,0,width,height);
 // Nested, irregular contours and two banks of hand-drawn fern fronds.
 for(let side=0;side<2;side++){c.save();c.translate(side?width:0,side?0:height);if(side)c.rotate(Math.PI);
  const size=Math.min(width*.35,height*.86);c.scale(size/260,size/260);
  for(let i=0;i<12;i++){c.beginPath();const r=53+i*17;
   for(let j=0;j<=90;j++){const a=j/90*TAU,rr=r*(1+.10*Math.sin(3*a+i*.1)+.06*Math.cos(5*a));const x=rr*Math.cos(a)*1.42-50,y=rr*Math.sin(a)*.82+10;j?c.lineTo(x,y):c.moveTo(x,y)}
   c.strokeStyle='rgba(120,174,119,.09)';c.lineWidth=.9;c.stroke()
  }
  function fern(bx,by,len,lean,tone){
   c.save();c.translate(bx,by);c.rotate(lean);
   const bend=t=>len*.2*t*t;
   c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(0,-len/2,bend(1),-len);c.strokeStyle=tone;c.lineWidth=1.5;c.stroke();
   for(let i=1;i<=15;i++){const t=i/16,x=bend(t),y=-len*t;
    for(const sign of [-1,1]){const leaf=len*(.09+.14*Math.sin(Math.PI*t))*(1-t*.77)*(1+rnd()*.17);
     c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+sign*leaf*.62,y-leaf*.05,x+sign*leaf,y-leaf*.81);
     c.quadraticCurveTo(x+sign*leaf*.26,y-leaf*.6,x,y);c.fillStyle=tone;c.fill()}
   }c.restore()
  }
  fern(-6,11,165,.23,'#254b37');fern(6,14,143,.85,'#306044');fern(3,11,101,1.08,'#46805a');fern(25,20,76,.29,'#385f43');
  c.restore()
 }
 for(let i=0;i<Math.max(65,width*.12);i++){const x=rnd()*width,y=rnd()*height,v=rnd(),r=.45+rnd()*1.35;
  if(v>.76){const halo=c.createRadialGradient(x,y,0,x,y,r*6);halo.addColorStop(0,'rgba(203,241,133,.24)');halo.addColorStop(1,'rgba(173,237,132,0)');c.fillStyle=halo;c.fillRect(x-r*6,y-r*6,r*12,r*12)}
  c.fillStyle=v>.76?'#a8c983':'rgba(139,193,151,.28)';c.beginPath();c.arc(x,y,r*.7,0,TAU);c.fill()
 }
}
function idleShape(c){
 path(c,figure);const g=c.createLinearGradient(-110,-100,95,92);g.addColorStop(0,'#94c577');g.addColorStop(.36,'#468d63');g.addColorStop(.75,'#286a52');g.addColorStop(1,'#174638');
 c.fillStyle=g;c.shadowBlur=22;c.shadowColor='rgba(130,241,156,.33)';c.fill('evenodd');c.shadowBlur=0;
 c.save();c.clip('evenodd');
 // Small flecks give the translucent surface its mineral texture.
 const rnd=randomGenerator(615);for(let i=0;i<310;i++){const x=rnd()*270-135,y=rnd()*240-120;c.fillStyle='rgba(220,255,199,'+(rnd()*.24+.04)+')';c.fillRect(x,y,.5+rnd()*.8,.7)}
 c.restore();path(c,figure);const edge=c.createLinearGradient(-85,-85,83,80);edge.addColorStop(0,'#ecffbe');edge.addColorStop(.52,'#b6f6b4');edge.addColorStop(1,'#68bba0');c.strokeStyle=edge;c.lineWidth=1.9;c.stroke();
}
function transformFold(c,l,factor){
 const xx=(factor-1)*l.x,yy=(factor-1)*l.y,k=l.a.x*l.x+l.a.y*l.y;
 c.transform(1+xx*l.x,yy*l.x,xx*l.y,1+yy*l.y,-xx*k,-yy*k)
}
function painted(c,fill,edge){path(c,figure);c.fillStyle=fill;c.fill('evenodd');c.strokeStyle=edge;c.lineWidth=1.5;c.stroke()}
function comparison(c,l,t){
 painted(c,'#548e8d','#a1d2cc');const factor=Math.cos(Math.PI*t);
 if(Math.abs(factor)<.001)return;
 c.save();transformFold(c,l,factor);painted(c,'#bf87a5','#f2b9d1');c.restore();
 c.save();path(c,figure);c.clip('evenodd');transformFold(c,l,factor);painted(c,'#b1de93','#d0f4b6');c.restore()
}
function line(c,a,b,color,dash,glow){
 c.save();c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.lineWidth=(dash?1.6:2.6)/camera.k;c.setLineDash(dash?[7/camera.k,6/camera.k]:[]);c.strokeStyle=color;c.shadowColor=color;c.shadowBlur=glow;c.stroke();c.restore()
}
function endpoints(c,p,down){
 c.save();const r=(down?23:9)/camera.k;const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,'rgba(229,255,198,.85)');g.addColorStop(.32,'rgba(191,255,157,.25)');g.addColorStop(1,'rgba(172,251,145,0)');c.fillStyle=g;c.fillRect(p.x-r,p.y-r,2*r,2*r);c.beginPath();c.arc(p.x,p.y,3/camera.k,0,TAU);c.fillStyle='#f2ffd8';c.fill();c.restore()
}
function fitMirror(l){
 let bounds;
 if(figure.radius){const m=mirror(pt(0,0),l),r=figure.radius;bounds=[pt(-r,-r),pt(r,r),pt(m.x-r,m.y-r),pt(m.x+r,m.y+r)]}
 else bounds=[...figure.vertices,...figure.vertices.map(p=>mirror(p,l))];
 const xs=bounds.map(p=>p.x),ys=bounds.map(p=>p.y),x1=Math.min(...xs),x2=Math.max(...xs),y1=Math.min(...ys),y2=Math.max(...ys);
 if(Math.max(-x1,x2)*scale<width*.44&&Math.max(-y1,y2)*scale<(height-90)*.48)return {x:0,y:0,k:1};
 return {x:(x1+x2)/2,y:(y1+y2)/2,k:Math.min(1,width*.83/(scale*(x2-x1)),(height-88)/(scale*(y2-y1)))};
}
// A reflection permutes the outer vertices and fixes their mean. The image of
// one farthest vertex therefore gives every possible axis direction. Test each
// candidate against the full filled area so cut-outs also affect the answer.
function findAxes(f){
 const ring=f.contours[0];
 const centre=pt(ring.reduce((s,p)=>s+p.x,0)/ring.length,ring.reduce((s,p)=>s+p.y,0)/ring.length);
 const offsets=ring.map(p=>pt(p.x-centre.x,p.y-centre.y));
 const lengths=offsets.map(v=>Math.hypot(v.x,v.y)),r=Math.max(...lengths);
 const first=offsets[lengths.indexOf(r)],base=Math.atan2(first.y,first.x);
 const result=[];
 offsets.forEach((v,i)=>{
  if(Math.abs(lengths[i]-r)>1e-7)return;
  const angle=(base+Math.atan2(v.y,v.x))/2,dx=Math.cos(angle),dy=Math.sin(angle);
  if(overlap(f,axis(centre,pt(centre.x+dx,centre.y+dy)))!==100)return;
  const projections=offsets.map(p=>p.x*dx+p.y*dy);
  const lo=Math.min(...projections)-12,hi=Math.max(...projections)+12;
  result.push([pt(centre.x+lo*dx,centre.y+lo*dy),pt(centre.x+hi*dx,centre.y+hi*dy)]);
 });
 return result;
}
function paintAnswer(c,now){
 if(!figure.radius){
  for(const [a,b] of figure.axes)line(c,a,b,'#ffdb8a',true,2);
  return;
 }
 const angles=reduceMotion.matches?[0,Math.PI/3,2*Math.PI/3]:[(now-answerStarted)*Math.PI/5500];
 for(const angle of angles){
  const tip=rotate(pt(0,figure.radius+12),angle);
  line(c,pt(-tip.x,-tip.y),tip,'#ffdb8a',true,2);
 }
 c.beginPath();c.arc(0,0,2.8,0,TAU);c.fillStyle='#fff4cf';c.fill();
}
function draw(now=performance.now()){
 cancelAnimationFrame(raf);const c=ctx;c.clearRect(0,0,width,height);let t=0,elapsed=now-start;
 const result=phase==='result'&&!showAnswer;const l=A&&B&&(A.x!==B.x||A.y!==B.y)?axis(A,B):null;
 if(showAnswer)camera={x:0,y:0,k:1};
 if(result){const accepted=passes(score),reduced=reduceMotion.matches,scoreT=reduced?1:Math.min(1,Math.max(0,elapsed/380));
  if(accepted)$('score').textContent=displayValue(score*(1-(1-scoreT)**3));
  const u=reduced?1:Math.min(1,Math.max(0,(elapsed-(accepted?420:0))/840));t=u*u*(3-2*u);
  camera={x:target.x*t,y:target.y*t,k:1+(target.k-1)*t};
  $('legend').hidden=!accepted||u===0;
  if(accepted)$('status').textContent=u<1?'正在對摺':score===100?'完全重合':'成功過關';
 }
 c.save();c.translate(width/2,height/2);c.scale(scale*camera.k,scale*camera.k);c.translate(-camera.x,-camera.y);
 if(phase==='finished'){c.restore();return}
 if(result&&l&&(t>0||reduceMotion.matches))comparison(c,l,t);else idleShape(c);
 if(A&&B&&!showAnswer){if(result&&l){const s=(width+height)/scale/camera.k;
   line(c,pt(A.x-l.y*s,A.y+l.x*s),pt(A.x+l.y*s,A.y-l.x*s),'rgba(213,241,202,.55)',true,0)}
  line(c,A,B,'#e4ffbd',false,11);endpoints(c,A,false);endpoints(c,B,phase==='drawing')}
 if(showAnswer)paintAnswer(c,now);
 if(result&&passes(score)&&!reduceMotion.matches&&elapsed>1260&&elapsed<1860){
  const p=(elapsed-1260)/600;c.beginPath();c.arc(0,0,111+p*49,0,TAU);c.lineWidth=2*(1-p)+.3;c.strokeStyle='rgba(210,255,169,'+(1-p)*.6+')';c.stroke()}
 c.restore();
 if(!reduceMotion.matches&&((result&&elapsed<(passes(score)?1865:1270))||(showAnswer&&figure.radius)))raf=requestAnimationFrame(draw)
}
function reset(){
 $('scorePanel').hidden=false;$('status').hidden=false;$('board').classList.remove('missed');$('announce').textContent='';
 phase='ready';pointer=null;A=B=null;camera={x:0,y:0,k:1};showAnswer=false;syncAnswer();$('retry').disabled=true;
 $('score').textContent='—';$('status').textContent='準備落筆';$('legend').hidden=true;cue('按住並拖出一條直線');note();draw()
}
function note(){
 $('foot').hidden=showAnswer||(phase==='result'&&!passes(score));
 $('note').textContent='找出任何一條對稱軸即可。重合率達 95% 就過關。';
}
function cue(msg){$('cue').hidden=!msg;$('cueText').textContent=msg}
function syncAnswer(){
 $('board').classList.toggle('answer-open',showAnswer);
 $('hint').setAttribute('aria-pressed',String(showAnswer));
 $('hint').querySelector('span').textContent=showAnswer?'隱藏答案':'答案';
 $('answerCaption').hidden=!showAnswer;
 if(!showAnswer)return;
 if(!figure.radius&&!figure.axes)figure.axes=findAxes(figure);
 $('answerCaption').textContent=figure.radius?'圓形有無數條對稱軸。每條穿過圓心的直線都是對稱軸。':$('title').textContent+'有 '+figure.axes.length+' 條對稱軸';
}
function buildMenu(){
 let n=0;
 for(const chapter of chapters){
  const group=document.createElement('optgroup');group.label=chapter.name;
  for(const q of chapter.items){const option=new Option(String(n+1).padStart(2,'0')+'　'+q.name,n);group.append(option);n++}
  $('choose').append(group);
 }
 $('choose').onchange=()=>{round=Number($('choose').value);$('hint').disabled=false;question()};
}
function progress(){
 const option=$('choose').options[round];
 option.textContent=String(round+1).padStart(2,'0')+'　'+questions[round].name+(passes(best[round])?'　✓':'');
}
function question(){
 $('instruction').textContent='畫一條直線，讓圖形對摺後完全重合。';$('scoreName').textContent='對稱重合率';$('unit').textContent='%';$('announce').textContent='';$('board').classList.remove('complete');
 const q=questions[round];figure=makeFigure(q);$('title').textContent=q.name;$('choose').value=String(round);$('chapter').textContent=chapters[q.group].name;$('num').textContent=String(round+1).padStart(2,'0');$('progress').textContent=(round+1)+' / '+questions.length;
 $('next').querySelector('span').textContent=round===questions.length-1?'完成挑戰':'下一題';progress();reset()
}
function resize(){
 if(phase==='drawing')reset();const r=$('game').getBoundingClientRect();width=r.width;height=r.height;
 const dpr=Math.min(window.devicePixelRatio||1,2);
 for(const id of ['game','art']){const c=$(id);c.width=Math.round(width*dpr);c.height=Math.round(height*dpr);c.getContext('2d').setTransform(c.width/width,0,0,c.height/height,0,0)}
 scale=Math.min(width/360,(height-68)/248,1.65);landscape();if(phase==='result')target=fitMirror(axis(A,B));draw()
}
function position(e){const r=$('game').getBoundingClientRect();return pt((e.clientX-r.left-width/2)/scale,(e.clientY-r.top-height/2)/scale)}
const game=$('game');
game.addEventListener('pointerdown',e=>{
 if(pointer!==null||!e.isPrimary||e.button!==0||phase==='finished')return;
 e.preventDefault();reset();pointer=e.pointerId;game.setPointerCapture(pointer);A=B=position(e);phase='drawing';cue('');$('status').textContent='正在畫線';draw()
});
game.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;e.preventDefault();B=position(e);draw()});
game.addEventListener('pointerup',e=>{
 if(e.pointerId!==pointer)return;e.preventDefault();B=position(e);pointer=null;
 if(Math.hypot(B.x-A.x,B.y-A.y)*scale<20){reset();cue('線太短了，請再拖長一點。');$('announce').textContent=$('cueText').textContent;return}
 const l=axis(A,B);score=overlap(figure,l);best[round]=Math.max(best[round]??0,score);phase='result';target=fitMirror(l);start=performance.now();$('retry').disabled=false;
 const accepted=passes(score);
 if(accepted){
  $('announce').textContent='對稱重合率 '+displayValue(score)+'%。成功過關。';
 }else{
  const message='這不是對稱軸';
  $('board').classList.add('missed');$('scorePanel').hidden=true;$('status').hidden=true;
  cue(message);$('announce').textContent=message;note();
 }
 progress();draw()
});
function cancel(e){if(e.pointerId===pointer)reset()}
game.addEventListener('pointercancel',cancel);game.addEventListener('lostpointercapture',cancel);
game.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
$('retry').onclick=reset;
$('hint').onclick=()=>{if(phase==='drawing')return;showAnswer=!showAnswer;answerStarted=performance.now();syncAnswer();note();draw()};
$('next').onclick=()=>{
 if(phase==='finished'){round=0;best.fill(null);$('choose').replaceChildren();buildMenu();$('hint').disabled=false;question();return}
 if(round<questions.length-1){round++;question();return}
 reset();phase='finished';const count=best.filter(passes).length;
 $('status').textContent='挑戰完成';cue('本輪練習完結');$('board').classList.add('complete');$('scoreName').textContent='已過關';$('score').textContent=count;$('unit').textContent='/ '+questions.length;$('instruction').textContent='你可以重新挑戰，再找出其他對稱軸。';$('announce').textContent=$('cueText').textContent;
 $('hint').disabled=true;$('next').querySelector('span').textContent='重新挑戰';$('title').textContent='挑戰完成';$('note').textContent='按「重新挑戰」，再練習一次。';draw()
};
buildMenu();question();resize();new ResizeObserver(resize).observe($('board'));
</script>
